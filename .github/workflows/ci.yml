name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Lint & typecheck (Astro)
        run: pnpm --filter frontvalencia-web run lint
      - name: Format (contratos)
        run: pnpm run format:check

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: pnpm --filter frontvalencia-web run test:unit

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter frontvalencia-web build
      - name: Verify dist
        run: test -d apps/web/dist && echo "Build OK" || exit 1
      - name: Upload web artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontvalencia-web-dist
          path: apps/web/dist/
          if-no-files-found: error

  smoke:
    name: smoke
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Download web artifact
        uses: actions/download-artifact@v7
        with:
          name: frontvalencia-web-dist
          path: apps/web/dist
      - name: Verify static output
        run: |
          test -f apps/web/dist/es/index.html
          test -f apps/web/dist/en/index.html
          test -f apps/web/dist/robots.txt
          echo "Smoke files OK"
      - name: Install Playwright browsers
        run: pnpm --filter frontvalencia-web exec playwright install --with-deps chromium
      - name: Playwright smoke
        run: pnpm --filter frontvalencia-web exec playwright test --project=chromium
      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
